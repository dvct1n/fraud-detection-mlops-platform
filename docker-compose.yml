version: "3.9"

services:
  fraud-inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_inference_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: mlflow_tracking_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --backend-store-uri /mlflow/mlruns --default-artifact-root /mlflow/mlruns --host 0.0.0.0 --port 5000
    restart: unless-stopped
